[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-runtime"
version = "0.1.2"
description = "Provider-agnostic voice call runtime for telephony projects"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Kasper Heikkinen" },
    { name = "Sami Heikkinen" },
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "twilio>=9.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
elevenlabs = [
    "elevenlabs>=1.9.0",
]
azure = [
    "azure-cognitiveservices-speech>=1.38.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
]

[tool.setuptools.packages.find]
include = ["voice_runtime*"]
